name: preview

# Plan § 3 / § 4 (ADR 0003): a preview is one HTML file on a public HTTPS link we can upload over.
# The page is saved with a command (curl) from a running rig and deployed straight to GitHub Pages.
# Nothing is committed: no preview in the repo, so the marker can be taken off again.
# Run with the lane marker for review; run again with an empty marker to clean up (same link).

on:
  workflow_dispatch:
    inputs:
      night:
        description: "Night to preview (YYYY-MM-DD)"
        required: true
        default: "2026-10-28"
      marker:
        description: "LANE_MARKER for the banner; leave empty to clean up (banner reads 'no marker set')"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: |
          corepack enable
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile
      - name: Save the digest page
        env:
          LANE_MARKER: ${{ inputs.marker }}
          NIGHT: ${{ inputs.night }}
          PORT: "8787"
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/health >/dev/null 2>&1 && break; sleep 1; done
          mkdir -p _site
          curl -fsS "http://localhost:8787/digest/${NIGHT}" -o _site/index.html
          touch _site/.nojekyll
          grep -c '<table' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
